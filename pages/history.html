<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'" />
    <title>Historial</title>
    <style>
      :root { --bg:#151518; --bg2:#1c1c20; --bg3:#26262c; --border:#2e2e35; --text:#e9e9ee; --dim:#9c9ca6; --faint:#6c6c76; --accent:#6c7bff; --danger:#e05252; }
      :root.light { --bg:#f2f3f7; --bg2:#ffffff; --bg3:#ececf2; --border:#d9dae2; --text:#191a1f; --dim:#54555e; --faint:#7a7b85; --accent:#4a5ae0; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
      header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:12px; padding:13px 24px; border-bottom:1px solid var(--border); background:var(--bg2); flex-wrap:wrap; }
      h1 { font-size:18px; font-weight:700; margin-right:auto; }
      input { flex:1; max-width:380px; padding:9px 13px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; outline:none; }
      input:focus { border-color:var(--accent); }
      button { padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; font-size:13px; }
      button:hover { filter:brightness(1.12); }
      button.ghost { background:transparent; color:var(--dim); }
      button.danger { color:var(--danger); }
      main { max-width:880px; margin:0 auto; padding:16px 24px 48px; }
      .day { margin-top:16px; }
      .day-head { display:flex; align-items:center; gap:10px; padding:7px 12px; border-radius:9px; background:var(--bg3); font-size:13px; font-weight:600; margin-bottom:4px; }
      .day-head .count { color:var(--faint); font-weight:400; margin-left:auto; margin-right:10px; }
      .row { display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:8px; }
      .row:hover { background:var(--bg3); }
      .title { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:38%; }
      .url { color:var(--dim); font-size:12px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .time { color:var(--faint); font-size:12px; flex-shrink:0; }
      .row .actions { flex-shrink:0; display:flex; gap:6px; }
      .empty { color:var(--faint); text-align:center; padding:60px 0; }
      .del { background:transparent; border:none; color:var(--dim); }
      .del:hover { color:var(--danger); }
      .delday { background:transparent; border:none; color:var(--faint); font-size:12px; }
      .delday:hover { color:var(--danger); }
      .pointer { cursor:pointer; }
    </style>
  </head>
  <body>
    <header>
      <h1>Historial</h1>
      <input id="q" type="text" placeholder="Buscar en el historial" />
      <button id="export" class="ghost">Exportar…</button>
      <button id="clear" class="danger">Borrar todo</button>
    </header>
    <main id="list"></main>
    <script>
      var q = document.getElementById('q')
      var list = document.getElementById('list')

      function dayKey(ts) {
        var d = new Date(ts)
        return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate()
      }
      function dayLabel(ts) {
        var d = new Date(ts)
        var today = new Date()
        var yest = new Date()
        yest.setDate(today.getDate() - 1)
        var same = function (a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate() }
        if (same(d, today)) return 'Hoy'
        if (same(d, yest)) return 'Ayer'
        return d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' })
      }
      function fmtTime(ts) {
        return new Date(ts).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })
      }

      async function render() {
        var items = await browserAPI.history.list(q.value)
        list.innerHTML = ''
        if (!items.length) {
          list.innerHTML = '<div class="empty">No hay historial</div>'
          return
        }
        var groups = {}
        items.forEach(function (h) {
          var k = dayKey(h.ts)
          groups[k] = groups[k] || { label: dayLabel(h.ts), ts: h.ts, rows: [] }
          groups[k].rows.push(h)
        })
        Object.keys(groups).sort(function (a, b) { return b < a ? -1 : 1 }).forEach(function (k) {
          var g = groups[k]
          var day = document.createElement('div')
          day.className = 'day'
          var head = document.createElement('div')
          head.className = 'day-head'
          head.innerHTML = '<span>' + g.label + '</span><span class="count">' + g.rows.length + '</span><button class="delday" title="Borrar este día">Borrar día</button>'
          head.querySelector('.delday').onclick = async function () {
            for (var i = 0; i < g.rows.length; i++) await browserAPI.history.remove(g.rows[i].url)
            render()
          }
          day.appendChild(head)
          g.rows.forEach(function (h) {
            var row = document.createElement('div')
            row.className = 'row'
            row.innerHTML =
              '<span class="title pointer"></span><span class="url pointer"></span><span class="time"></span>' +
              '<span class="actions"><button class="copyurl" title="Copiar URL">Copiar</button><button class="del" title="Eliminar">Eliminar</button></span>'
            row.querySelector('.title').textContent = h.title || h.url
            row.querySelector('.url').textContent = h.url
            row.querySelector('.time').textContent = fmtTime(h.ts)
            row.querySelector('.title').onclick = function () { browserAPI.openTab(h.url) }
            row.querySelector('.url').onclick = function () { browserAPI.openTab(h.url) }
            row.querySelector('.title').onauxclick = function (e) { if (e.button === 1) browserAPI.openTab(h.url) }
            row.querySelector('.copyurl').onclick = function () {
              var ta = document.createElement('textarea')
              ta.value = h.url
              document.body.appendChild(ta)
              ta.select()
              try { document.execCommand('copy') } catch {}
              document.body.removeChild(ta)
            }
            row.querySelector('.del').onclick = async function () {
              await browserAPI.history.remove(h.url)
              render()
            }
            day.appendChild(row)
          })
          list.appendChild(day)
        })
      }

      q.addEventListener('input', render)
      document.getElementById('export').onclick = async function () {
        var items = await browserAPI.history.list('')
        var blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' })
        var a = document.createElement('a')
        a.href = URL.createObjectURL(blob)
        a.download = 'historial.json'
        a.click()
        setTimeout(function () { URL.revokeObjectURL(a.href) }, 2000)
      }
      document.getElementById('clear').onclick = async function () {
        if (confirm('¿Borrar todo el historial?')) {
          await browserAPI.history.clear()
          render()
        }
      }
      render()

      browserAPI.settings.get().then(function (s) {
        if (s.theme === 'light' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light')
        }
      })
    </script>
  </body>
</html>
