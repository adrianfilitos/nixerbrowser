<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'" />
    <title>Historial</title>
    <style>
      :root { --bg:#141414; --bg2:#1b1b1b; --bg3:#222; --border:#2c2c2c; --text:#e8e8e8; --dim:#9a9a9a; --faint:#6a6a6a; --accent:#4a6cf7; --danger:#e05252; }
      :root.light { --bg:#f4f4f4; --bg2:#ffffff; --bg3:#ececec; --border:#d6d6d6; --text:#1a1a1a; --dim:#555; --faint:#777; --danger:#d23b3b; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
      header { display:flex; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid var(--border); background:var(--bg2); }
      h1 { font-size:20px; font-weight:600; }
      input { flex:1; max-width:420px; padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; outline:none; }
      input:focus { border-color:var(--accent); }
      button { padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; font-size:13px; }
      button:hover { filter:brightness(1.15); }
      button.danger { color:var(--danger); }
      main { max-width:860px; margin:0 auto; padding:16px 24px; }
      .row { display:flex; align-items:center; gap:14px; padding:10px 12px; border-radius:10px; }
      .row:hover { background:var(--bg3); }
      .title { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40%; }
      .url { color:var(--dim); font-size:12px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .time { color:var(--faint); font-size:12px; flex-shrink:0; }
      .row .actions { flex-shrink:0; display:flex; gap:6px; }
      .empty { color:var(--faint); text-align:center; padding:60px 0; }
      .del { background:transparent; border:none; color:var(--dim); }
      .del:hover { color:var(--danger); }
    </style>
  </head>
  <body>
    <header>
      <h1>Historial</h1>
      <input id="q" type="text" placeholder="Buscar en el historial" />
      <button id="clear" class="danger">Borrar todo</button>
    </header>
    <main id="list"></main>
    <script>
      var q = document.getElementById('q')
      var list = document.getElementById('list')
      var clearBtn = document.getElementById('clear')

      function fmt(ts) {
        var d = new Date(ts)
        return d.toLocaleDateString('es') + ' ' + d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })
      }

      async function render() {
        var items = await browserAPI.history.list(q.value)
        list.innerHTML = ''
        if (!items.length) {
          list.innerHTML = '<div class="empty">No hay historial</div>'
          return
        }
        items.forEach(function (h) {
          var row = document.createElement('div')
          row.className = 'row'
          row.innerHTML =
            '<span class="title"></span><span class="url"></span><span class="time"></span>' +
            '<span class="actions"><button class="del" title="Eliminar">Eliminar</button></span>'
          row.querySelector('.title').textContent = h.title || h.url
          row.querySelector('.title').style.cursor = 'pointer'
          row.querySelector('.url').textContent = h.url
          row.querySelector('.time').textContent = fmt(h.ts)
          row.querySelector('.title').onclick = function () { browserAPI.openTab(h.url) }
          row.querySelector('.url').style.cursor = 'pointer'
          row.querySelector('.url').onclick = function () { browserAPI.openTab(h.url) }
          row.querySelector('.del').onclick = async function () {
            await browserAPI.history.remove(h.url)
            render()
          }
          list.appendChild(row)
        })
      }

      q.addEventListener('input', render)
      clearBtn.addEventListener('click', async function () {
        if (confirm('¿Borrar todo el historial?')) {
          await browserAPI.history.clear()
          render()
        }
      })
      render()

      browserAPI.settings.get().then(function (s) {
        if (s.theme === 'light' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light')
        }
      })
    </script>
  </body>
</html>
