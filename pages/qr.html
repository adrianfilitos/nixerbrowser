<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'" />
    <title>Código QR</title>
    <style>
      :root { --bg:#151518; --bg2:#1c1c20; --bg3:#26262c; --border:#2e2e35; --text:#e9e9ee; --dim:#9c9ca6; --faint:#6c6c76; --accent:#6c7bff; }
      :root.light { --bg:#f2f3f7; --bg2:#ffffff; --bg3:#ececf2; --border:#d9dae2; --text:#191a1f; --dim:#54555e; --faint:#7a7b85; --accent:#4a5ae0; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
      .card { text-align:center; }
      h1 { font-size:20px; margin-bottom:6px; }
      .url { color:var(--dim); font-size:13px; margin-bottom:20px; max-width:420px; word-break:break-all; }
      .qr { width:260px; height:260px; background:#fff; border-radius:14px; padding:12px; margin:0 auto 20px; }
      .qr img { width:100%; height:100%; }
      button { padding:10px 18px; border-radius:10px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; font-size:13px; margin:0 5px; }
      button:hover { filter:brightness(1.1); }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Código QR</h1>
      <div class="url" id="url"></div>
      <div class="qr"><img id="qr" alt="QR" /></div>
      <div>
        <button id="copy">Copiar URL</button>
        <button id="close">Cerrar pestaña</button>
      </div>
    </div>
    <script>
      var target = new URLSearchParams(location.search).get('url') || location.href
      document.getElementById('url').textContent = target
      document.getElementById('qr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=' + encodeURIComponent(target)
      document.getElementById('copy').onclick = function () {
        var ta = document.createElement('textarea')
        ta.value = target
        document.body.appendChild(ta)
        ta.select()
        try { document.execCommand('copy') } catch {}
        document.body.removeChild(ta)
      }
      document.getElementById('close').onclick = function () { history.length > 1 ? history.back() : (location.href = 'nixer://newtab') }
    </script>
  </body>
</html>
