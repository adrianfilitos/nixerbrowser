<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'" />
    <title>Pop-up</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root { --bg:#1b1b1b; --bg2:#222; --bg3:#2a2a2a; --border:#2c2c2c; --text:#e8e8e8; --dim:#9a9a9a; --faint:#6a6a6a; --accent:#4a6cf7; --danger:#e05252; }
      html, body { height: 100%; }
      body { font-family: system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
      #root { height: 100%; border-radius: 10px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
      .menu { padding: 6px; max-height: 100%; overflow-y: auto; }
      .item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); }
      .item:hover { background: var(--bg2); }
      .item.danger { color: var(--danger); }
      .item .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .item .sublabel { font-size: 11px; color: var(--faint); max-width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .item.disabled { opacity: 0.5; cursor: default; }
      .item.disabled:hover { background: transparent; }
      .item .accel { font-size: 11px; color: var(--faint); margin-left: 12px; }
      .item .icon { width: 16px; height: 16px; flex-shrink: 0; color: var(--dim); display: flex; align-items: center; justify-content: center; }
      .item .color-dot { width: 12px; height: 12px; flex-shrink: 0; border-radius: 50%; }
      .sep { height: 1px; background: var(--border); margin: 5px 8px; }
      .head { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; height: 42px; padding: 0 14px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
      .link { background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 500; }
      .list { flex: 1; min-height: 0; overflow-y: auto; }
      .row { display: flex; flex-direction: column; gap: 4px; height: 66px; padding: 7px 12px; border-bottom: 1px solid var(--border); }
      .row:last-child { border-bottom: none; }
      .row:hover { background: var(--bg2); }
      .row-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .thumb { width: 38px; height: 38px; flex-shrink: 0; border-radius: 8px; background: var(--bg3); display: flex; align-items: center; justify-content: center; color: var(--dim); overflow: hidden; font-size: 15px; }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .actions { display: flex; gap: 2px; flex-shrink: 0; }
      .meta { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bar { height: 3px; border-radius: 2px; background: var(--bg3); overflow: hidden; }
      .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), #7a8fff); border-radius: 2px; transition: width .2s ease; }
      .icon-btn { width: 22px; height: 22px; border: none; border-radius: 6px; background: transparent; color: var(--dim); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .icon-btn:hover { background: var(--bg3); color: var(--text); }
      .empty { color: var(--faint); text-align: center; padding: 26px 0; font-size: 13px; }
      .foot { flex-shrink: 0; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--dim); }
      .body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; }
      .body .origin { font-size: 12px; color: var(--dim); word-break: break-all; margin-bottom: 4px; }
      .body .perm-line { font-size: 13px; margin-bottom: 10px; line-height: 1.4; }
      .body .perm-line b { color: var(--text); }
      .label-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); margin: 10px 0 2px; }
      .body input[type=text] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg0); color: var(--text); font-size: 13px; outline: none; margin-top: 4px; }
      .body input[type=text]:focus { border-color: var(--accent); }
      .check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); cursor: pointer; user-select: none; padding: 4px 0; }
      .check input { accent-color: var(--accent); }
      .btns { flex-shrink: 0; display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }
      .btn { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); font-size: 12.5px; cursor: pointer; }
      .btn:hover { background: var(--bg3); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.primary:hover { filter: brightness(1.1); }
      .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
      .btn.danger:hover { background: rgba(224,82,82,.12); }
      .toast-wrap { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
      .toast { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--border); font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
      .toast.ok { border-left: 3px solid #3da26e; }
      .toast.info { border-left: 3px solid var(--accent); }
      .toast.warn { border-left: 3px solid var(--warn, #d99a2b); }
      .toast.err { border-left: 3px solid var(--danger); }
      .search { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
      .search input { flex: 1; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg0); color: var(--text); font-size: 13px; outline: none; }
      .search input:focus { border-color: var(--accent); }
      .list-scroll { flex: 1; min-height: 0; overflow-y: auto; }
      .pick { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; font-size: 13px; }
      .pick:hover, .pick.sel { background: var(--bg2); }
      .pick .pick-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pick .pick-url { font-size: 11px; color: var(--faint); max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pick .kbd { font-size: 10px; color: var(--faint); }
      .empty2 { color: var(--faint); text-align: center; padding: 20px 0; font-size: 12.5px; }
      .rowline { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 12.5px; }
      .rowline .lbl { flex: 1; }
      .switch { position: relative; width: 34px; height: 18px; border-radius: 9px; background: var(--bg3); border: 1px solid var(--border); cursor: pointer; flex-shrink: 0; }
      .switch.on { background: var(--accent); border-color: var(--accent); }
      .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left .15s ease; }
      .switch.on::after { left: 18px; }

      /* ---- Tarjeta de perfil ---- */
      .profile-card { display: flex; flex-direction: column; height: 100%; }
      .profile-head { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 20px 14px 14px; border-bottom: 1px solid var(--border); }
      .profile-big { width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px; font-weight: 700; overflow: hidden; margin-bottom: 6px; }
      .profile-big img { width: 100%; height: 100%; object-fit: cover; }
      .profile-name { font-size: 15px; font-weight: 600; }
      .profile-email { font-size: 11.5px; color: var(--faint); }
      .profile-badge { margin-top: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 2px 9px; border-radius: 10px; background: var(--bg3); color: var(--dim); }
      .profile-badge.cloud { background: rgba(74,108,247,.16); color: #8ea0ff; }
      .profile-sync { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--dim); }
      .profile-sync .ok { color: #3da26e; }
      .profile-sync .spacer { flex: 1; }
      .profile-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px; }
      .profile-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
      .profile-row:hover { background: var(--bg2); }
      .profile-row .p-avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 700; overflow: hidden; }
      .profile-row .p-avatar img { width: 100%; height: 100%; object-fit: cover; }
      .profile-row .p-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .profile-row .p-check { color: var(--accent); width: 16px; flex-shrink: 0; display: flex; }
      .profile-acts { flex-shrink: 0; padding: 6px; border-top: 1px solid var(--border); }
      .profile-act { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; border-radius: 8px; background: transparent; color: var(--text); font-size: 12.5px; cursor: pointer; text-align: left; }
      .profile-act:hover { background: var(--bg2); }
      .profile-act.danger { color: var(--danger); }
      .profile-act .act-icon { width: 16px; height: 16px; flex-shrink: 0; display: flex; }

      .stat { font-size: 11px; color: var(--dim); }
      .dialog-msg { font-size: 13px; line-height: 1.5; padding: 14px; }
      .dialog-msg b { color: var(--text); }
      .ai-head { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
      .ai-thread { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
      .ai-msg { font-size: 12.5px; line-height: 1.5; padding: 8px 10px; border-radius: 9px; max-width: 92%; white-space: pre-wrap; word-break: break-word; }
      .ai-msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
      .ai-msg.assistant { align-self: flex-start; background: var(--bg2); }
      .ai-msg.err { align-self: flex-start; background: rgba(224,82,82,.15); color: var(--danger); }
      .ai-msg.thinking { color: var(--faint); font-style: italic; }
      .ai-empty { color: var(--faint); font-size: 12px; text-align: center; padding: 18px 0; line-height: 1.6; }
      .ai-input { flex-shrink: 0; display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
      .ai-input input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg0); color: var(--text); font-size: 13px; outline: none; }
      .ai-input input:focus { border-color: var(--accent); }
      .ai-input button { border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 0 14px; cursor: pointer; }
      .ai-input button:disabled { opacity: .5; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const root = document.getElementById('root')
      let KEY = null

      function fmtSize(n) {
        if (!n || n <= 0) return ''
        const u = ['B', 'KB', 'MB', 'GB']
        let i = 0
        while (n >= 1024 && i < u.length - 1) { n /= 1024; i++ }
        return n.toFixed(1) + ' ' + u[i]
      }

      function iconFor(type) {
        const svgs = {

          newtab: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
          window: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/></svg>',
          incognito: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v2M12 15v2M7 12h2M15 12h2"/></svg>',
          ai: '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 4.6L18 8l-4.4 1.4L12 14l-1.6-4.6L6 8l4.4-1.4z"/></svg>',
          find: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
          history: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
          downloads: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>',
          star: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3 6.2 6.9 1-5 4.8 1.2 6.9L12 17.8 5.9 21l1.2-6.9-5-4.8 6.9-1z"/></svg>',
          settings: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>',
          about: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 12v4"/></svg>',
          profiles: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>',
          img: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5-8 8"/></svg>',
          vid: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="13" height="12" rx="2"/><path d="M15 10l5-3v10l-5-3"/></svg>',
          aud: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
          arc: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
          pdf: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h2M8 17h4"/></svg>',
          app: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>',
          doc: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',
          volume: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>',
          form: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4L7 21H3v-4L17 3z"/></svg>',
          arrow: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
          close: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
          copy: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
          restore: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
          pin: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6M12 4v5l3 3v3H9v-3l3-3V4"/></svg>',
          color: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18c1.5 0 2-1 1-2.5-.8-1.2 0-2.5 2-2.5h2.5A3.5 3.5 0 0 0 21 12.5 9 9 0 0 0 12 3z"/><circle cx="8" cy="10" r="1"/><circle cx="12" cy="8" r="1"/><circle cx="16" cy="10" r="1"/></svg>',
          xls: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8l8 8M16 8l-8 8"/></svg>',
          ppt: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M3 12h18"/></svg>',
          file: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
        }
        return svgs[type] || svgs.menu
      }

      function renderMenu(payload) {
        const items = payload.items || []
        const h = []
        items.forEach((it) => {
          if (it.type === 'sep') { h.push('<div class="sep"></div>'); return }
          h.push('<div class="item' + (it.danger ? ' danger' : '') + (it.enabled === false ? ' disabled' : '') + '" data-key="' + (it.key || '') + '">' +
            (it.dotColor ? '<span class="color-dot" style="background:' + it.dotColor + '"></span>' : (it.icon ? '<span class="icon">' + iconFor(it.icon) + '</span>' : '')) +
            '<span class="label"></span>' +
            (it.sublabel ? '<span class="sublabel"></span>' : '') +
            (it.accel ? '<span class="accel">' + it.accel + '</span>' : '') +
            '</div>')
        })
        root.innerHTML = '<div class="menu">' + h.join('') + '</div>'
        root.querySelectorAll('.item').forEach((el) => {
          const it = items.find((x) => (x.key || '') === el.dataset.key)
          if (it) {
            el.querySelector('.label').textContent = it.label || ''
            if (it.sublabel) el.querySelector('.sublabel').textContent = it.sublabel
          }
          el.addEventListener('click', () => { if (el.dataset.key && it && it.enabled !== false) popupAPI.action(KEY, el.dataset.key) })
        })
      }

      function renderProfile(p) {
        const big = p.avatarSource === 'provider' && p.avatar
          ? '<img src="' + p.avatar + '" alt="" />'
          : (p.name ? p.name.slice(0, 1).toUpperCase() : 'N')
        const typeLabel = p.cloud ? (p.email || 'Nube') : 'Perfil local'
        const badge = '<span class="profile-badge' + (p.cloud ? ' cloud' : '') + '">' + (p.cloud ? 'Nube' : 'Local') + '</span>'
        const syncRow = p.cloud
          ? '<div class="profile-sync">' +
              (p.lastSync
                ? '<span class="ok"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><span>Sincronizado · ' + relTime(p.lastSync) + '</span>'
                : '<span style="color:var(--dim)">Sin sincronizar</span>') +
              '<span class="spacer"></span>' +
              '<button class="link" data-sync>Sync</button>' +
            '</div>'
          : ''
        const rows = (p.profiles || []).map((pr) => {
          const pa = pr.avatarSource === 'provider' && pr.avatar
            ? '<img src="' + pr.avatar + '" alt="" />'
            : (pr.name ? pr.name.slice(0, 1).toUpperCase() : 'N')
          const active = pr.id === p.activeId
          return '<div class="profile-row" data-switch="' + pr.id + '">' +
            '<span class="p-avatar" style="background:' + (pr.color || '#6c7bff') + '">' + pa + '</span>' +
            '<span class="p-name">' + (pr.name || '') + (pr.id === p.activeId ? ' <span style="color:var(--faint)">(actual)</span>' : '') + '</span>' +
            '<span class="p-check">' + (active ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : '') + '</span>' +
          '</div>'
        }).join('')
        const act = (k, label, danger, icon) =>
          '<button class="profile-act' + (danger ? ' danger' : '') + '" data-act="' + k + '">' +
          '<span class="act-icon">' + (icon || '') + '</span><span>' + label + '</span></button>'
        const acts = []
        acts.push(act('menu', 'Menú del navegador', false, '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>'))
        if (!p.cloud && p.cloudConfigured) acts.push(act('signin-google', 'Iniciar sesión con Google', false, '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 4.6L18 8l-4.4 1.4L12 14l-1.6-4.6L6 8l4.4-1.4z"/></svg>'))
        acts.push(act('new-local', 'Nuevo perfil local', false, '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'))
        acts.push(act('manage', 'Gestionar perfiles', false, '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>'))
        if (p.cloud) acts.push(act('signout', 'Cerrar sesión', true, '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>'))
        root.innerHTML =
          '<div class="profile-card">' +
            '<div class="profile-head">' +
              '<div class="profile-big" style="background:' + (p.color || '#6c7bff') + '">' + big + '</div>' +
              '<div class="profile-name">' + (p.name || '') + '</div>' +
              '<div class="profile-email">' + typeLabel + '</div>' +
              badge +
            '</div>' +
            syncRow +
            '<div class="profile-list">' + rows + '</div>' +
            '<div class="profile-acts">' + acts.join('') + '</div>' +
          '</div>'
        root.querySelectorAll('[data-switch]').forEach((el) => el.addEventListener('click', () => popupAPI.action(KEY, 'switch:' + el.dataset.switch)))
        root.querySelectorAll('[data-act]').forEach((el) => el.addEventListener('click', () => popupAPI.action(KEY, el.dataset.act)))
        const sync = root.querySelector('[data-sync]')
        if (sync) sync.addEventListener('click', () => popupAPI.action(KEY, 'sync'))
      }

      function relTime(ts) {
        const n = Date.now() - ts
        const m = Math.floor(n / 60000)
        if (m < 1) return 'ahora'
        if (m < 60) return m + ' min'
        const h = Math.floor(m / 60)
        if (h < 24) return h + ' h'
        return Math.floor(h / 24) + ' d'
      }

      function typeIcon(name) {
        const ext = (name || '').split('.').pop().toLowerCase()
        if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg', 'ico'].includes(ext)) return 'img'
        if (['mp4', 'webm', 'mkv', 'mov', 'avi'].includes(ext)) return 'vid'
        if (['mp3', 'wav', 'ogg', 'flac', 'm4a'].includes(ext)) return 'aud'
        if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return 'arc'
        if (['pdf'].includes(ext)) return 'pdf'
        if (['exe', 'msi', 'apk'].includes(ext)) return 'app'
        if (['doc', 'docx', 'txt', 'md', 'rtf'].includes(ext)) return 'doc'
        if (['xls', 'xlsx', 'csv'].includes(ext)) return 'xls'
        if (['ppt', 'pptx'].includes(ext)) return 'ppt'
        return 'file'
      }

      function renderDownloads(payload) {
        const dls = payload.downloads || []
        const head = payload.head || 'Descargas'
        const h = ['<div class="head"><span>' + head + '</span><span style="display:flex;gap:12px">' + (payload.showAll ? '<button class="link" id="all">Ver todas</button>' : '') + '<button class="link" id="clearall" style="color:var(--danger)">Limpiar</button></span></div>']
        if (!dls.length) {
          h.push('<div class="empty">No hay descargas</div>')
        } else {
          h.push('<div class="list">'); dls.forEach((d, i) => {
            const ext = (d.name || '').split('.').pop().toLowerCase()
            const isImg = d.path && ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg', 'ico'].includes(ext)
            const pct = d.total > 0 ? Math.round((d.received / d.total) * 100) : 0
            const btns = d.state === 'in-progress'
              ? '<button class="icon-btn" data-cancel="' + i + '" title="Cancelar">' + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>' + '</button>'
              : '<button class="icon-btn" data-open="' + i + '" title="Abrir">' + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>' + '</button>' +
                '<button class="icon-btn" data-show="' + i + '" title="Mostrar en carpeta">' + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>' + '</button>' +
                '<button class="icon-btn" data-del="' + i + '" title="Eliminar">' + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg>' + '</button>'
            h.push('<div class="row" data-i="' + i + '">' +
              '<div class="row-top">' +
                '<div class="thumb" data-thumb="' + i + '">' + iconFor(typeIcon(d.name)) + '</div>' +
                '<div class="name"></div>' +
                '<div class="actions">' + btns + '</div>' +
              '</div>' +
              '<div class="meta"></div>' +
              (d.state === 'in-progress' ? '<div class="bar"><div style="width:' + (pct || 0) + '%"></div></div>' : '') +
              '</div>')
          })
          h.push('</div>')
        }
        if (payload.foot) h.push('<div class="foot">' + payload.foot + '</div>')
        root.innerHTML = h.join('')
        dls.forEach((d, i) => {
          const name = root.querySelectorAll('.name')[i]
          const meta = root.querySelectorAll('.meta')[i]
          if (name) name.textContent = d.name
          if (meta) meta.textContent = d.state === 'in-progress' ? pct(d) + '% · ' + fmtSize(d.received) + ' / ' + fmtSize(d.total) : d.state === 'completed' ? 'Completado · ' + fmtSize(d.total) : 'Cancelado'
          const thumb = root.querySelector('[data-thumb="' + i + '"]')
          if (thumb) {
            const ext2 = (d.name || '').split('.').pop().toLowerCase()
            if (d.path && ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg', 'ico'].includes(ext2)) {
              popupAPI.downloadsPreview(d.path).then((data) => { if (data) thumb.innerHTML = '<img src="' + data + '" alt="" />' }).catch(() => {})
            }
          }
        })
        function pct(d) { return d.total > 0 ? Math.round((d.received / d.total) * 100) : 0 }
        root.querySelectorAll('[data-cancel]').forEach((b) => b.addEventListener('click', () => popupAPI.action(KEY, 'cancel:' + b.dataset.cancel)))
        root.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => popupAPI.action(KEY, 'open:' + b.dataset.open)))
        root.querySelectorAll('[data-show]').forEach((b) => b.addEventListener('click', () => popupAPI.action(KEY, 'show:' + b.dataset.show)))
        root.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => popupAPI.action(KEY, 'del:' + b.dataset.del)))
        const all = document.getElementById('all')
        if (all) all.addEventListener('click', () => popupAPI.action(KEY, 'all'))
        const clearall = document.getElementById('clearall')
        if (clearall) clearall.addEventListener('click', () => popupAPI.action(KEY, 'clear'))
      }

      function renderPermission(payload) {
        root.innerHTML = '' +
          '<div class="body">' +
            '<div class="origin">' + (payload.origin || '') + '</div>' +
            '<div class="perm-line">Quiere usar: <b>' + (payload.label || payload.permission || '') + '</b></div>' +
            '<div class="perm-line" style="margin-bottom:0;font-size:11px;color:var(--faint)">Permitir se guarda para este sitio. "Permitir una vez" solo dura en esta pestaña.</div>' +
          '</div>' +
          '<div class="btns">' +
            '<button class="btn danger" data-m="deny">Bloquear</button>' +
            '<button class="btn" data-m="once">Permitir una vez</button>' +
            '<button class="btn primary" data-m="allow">Permitir</button>' +
          '</div>'
        root.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => popupAPI.action(KEY, JSON.stringify({ mode: b.dataset.m }))))
      }

      function renderBookmark(payload) {
        root.innerHTML = '' +
          '<div class="body">' +
            '<div class="label-row">Nombre</div>' +
            '<input type="text" id="bm-name" value="' + (payload.title || '').replace(/"/g, '&quot;') + '" spellcheck="false" />' +
            '<div class="label-row">Dirección</div>' +
            '<div class="origin" style="margin:4px 0 0">' + (payload.url || '') + '</div>' +
          '</div>' +
          '<div class="btns">' +
            '<button class="btn" data-m="cancel">Cancelar</button>' +
            '<button class="btn primary" data-m="save">Guardar</button>' +
          '</div>'
        const send = (mode) => {
          if (mode === 'save') {
            const name = (root.querySelector('#bm-name') || {}).value || ''
            popupAPI.action(KEY, JSON.stringify({ mode: 'save', title: name }))
          } else {
            popupAPI.action(KEY, JSON.stringify({ mode: 'cancel' }))
          }
        }
        root.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => send(b.dataset.m)))
        const inp = root.querySelector('#bm-name')
        if (inp) {
          inp.focus()
          inp.select()
          inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') send('save')
            if (e.key === 'Escape') send('cancel')
          })
        }
      }

      function renderToasts(payload) {
        const list = payload.toasts || []
        root.innerHTML = '<div class="toast-wrap">' + list.map((t) =>
          '<div class="toast ' + (t.kind || 'info') + '"><span>' + (t.msg || '').replace(/</g, '&lt;') + '</span></div>'
        ).join('') + '</div>'
      }

      function renderList(payload, onPick, inputPlaceholder) {
        const items = payload.items || []
        const q = (payload.query || '').toLowerCase()
        const filtered = items.filter((it) => !it.type || !q || (it.title + ' ' + (it.url || '')).toLowerCase().includes(q))
        const sel = Math.min(payload.selected || 0, Math.max(0, filtered.length - 1))
        let html = '<div class="search"><input id="q" value="' + (payload.query || '').replace(/"/g, '&quot;') + '" placeholder="' + (inputPlaceholder || 'Buscar…') + '" spellcheck="false" /></div><div class="list-scroll">'
        if (!filtered.length) html += '<div class="empty2">Sin resultados</div>'
        else html += filtered.map((it, i) => '<div class="pick' + (i === sel ? ' sel' : '') + '" data-i="' + i + '"><span class="pick-title"></span>' + (it.url ? '<span class="pick-url"></span>' : '') + (it.accel ? '<span class="kbd">' + it.accel + '</span>' : '') + '</div>').join('')
        html += '</div>'
        root.innerHTML = html
        filtered.forEach((it, i) => {
          const el = root.querySelector('[data-i="' + i + '"]')
          if (!el) return
          el.querySelector('.pick-title').textContent = it.title || ''
          if (it.url && el.querySelector('.pick-url')) el.querySelector('.pick-url').textContent = it.url
          el.addEventListener('click', () => onPick(i))
        })
        const inp = root.querySelector('#q')
        if (inp) {
          inp.focus()
          inp.addEventListener('input', () => popupAPI.action(KEY, JSON.stringify({ t: 'q', v: inp.value })))
          inp.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') popupAPI.action(KEY, JSON.stringify({ t: 'down' }))
            else if (e.key === 'ArrowUp') popupAPI.action(KEY, JSON.stringify({ t: 'up' }))
            else if (e.key === 'Enter') popupAPI.action(KEY, JSON.stringify({ t: 'enter' }))
            else if (e.key === 'Escape') popupAPI.action(KEY, JSON.stringify({ t: 'close' }))
          })
        }
      }

      function renderDialog(payload) {
        const buttons = payload.buttons || [{ label: 'Aceptar', value: 'ok', primary: true }]
        root.innerHTML =
          '<div class="dialog-msg">' + (payload.message || '') + '</div>' +
          '<div class="btns">' + buttons.map((b) => '<button class="btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : '') + '" data-v="' + b.value + '">' + (b.label || b.value) + '</button>').join('') + '</div>'
        root.querySelectorAll('[data-v]').forEach((b) => b.addEventListener('click', () => popupAPI.action(KEY, JSON.stringify({ t: 'btn', v: b.dataset.v }))))
        window.addEventListener('keydown', function esc(e) {
          if (e.key === 'Escape') { window.removeEventListener('keydown', esc); popupAPI.action(KEY, JSON.stringify({ t: 'btn', v: 'cancel' })) }
        })
      }

      function renderShields(payload) {
        const s = payload.state || {}
        const rows = [
          ['blockAds', 'Bloquear anuncios'],
          ['blockTrackers', 'Bloquear rastreadores'],
          ['blockScripts', 'Bloquear scripts'],
          ['blockCookies', 'Bloquear cookies de terceros'],
        ]
        root.innerHTML = '<div class="body">' +
          rows.map(([k, l]) => '<div class="rowline"><span class="lbl">' + l + '</span><span class="switch' + (s[k] ? ' on' : '') + '" data-k="' + k + '"></span></div>').join('') +
          (payload.ads + payload.scripts + payload.trackers ? '<div class="stat" style="padding-top:8px">Bloqueados: ' + payload.ads + ' anuncios · ' + payload.scripts + ' scripts · ' + payload.trackers + ' rastreadores</div>' : '') +
          '</div><div class="btns"><button class="btn danger" data-clear>Limpiar datos del sitio</button></div>'
        root.querySelectorAll('.switch').forEach((sw) => sw.addEventListener('click', () => popupAPI.action(KEY, JSON.stringify({ t: 'toggle', k: sw.dataset.k }))))
        const cl = root.querySelector('[data-clear]')
        if (cl) cl.addEventListener('click', () => popupAPI.action(KEY, JSON.stringify({ t: 'clear' })))
      }

      function renderSiteInfo(payload) {
        const kind = payload.kind || 'unknown'
        const label = payload.label || ''
        root.innerHTML = '<div class="body">' +
          '<div class="origin">' + (payload.origin || '') + '</div>' +
          '<div class="rowline"><span class="lbl">Conexión</span><span>' + (kind === 'secure' ? 'Segura' : kind === 'insecure' ? 'No segura' : label) + '</span></div>' +
          '<div class="rowline"><span class="lbl">Cookies</span><span id="ck">…</span></div>' +
          '</div><div class="btns"><button class="btn" data-copy>Copiar URL</button><button class="btn danger" data-clear>Limpiar cookies</button></div>'
        root.querySelector('[data-copy]').addEventListener('click', () => popupAPI.action(KEY, JSON.stringify({ t: 'copy' })))
        root.querySelector('[data-clear]').addEventListener('click', () => popupAPI.action(KEY, JSON.stringify({ t: 'clear' })))
        if (payload.cookies !== undefined) root.querySelector('#ck').textContent = String(payload.cookies)
        else popupAPI.cookies ? popupAPI.cookies(payload.origin).then((n) => { root.querySelector('#ck').textContent = String(n) }).catch(() => {}) : null
      }

      function renderTaskManager(payload) {
        const rows = payload.rows || []
        root.innerHTML = '<div class="head"><span>Administrador de tareas</span><button class="icon-btn" data-close>' + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' + '</button></div><div class="list">' +
          (rows.length ? rows.map((r, i) => '<div class="row" data-k="' + i + '"><div class="row-top"><div class="name"></div><button class="icon-btn" data-kill="' + i + '">' + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>' + '</button></div><div class="meta"></div></div>').join('') : '<div class="empty">Sin procesos</div>') +
          '</div><div class="foot">Memoria total: ' + (payload.total ? (payload.total / 1048576).toFixed(0) + ' MB' : '') + '</div>'
        rows.forEach((r, i) => {
          const el = root.querySelector('[data-k="' + i + '"]')
          if (!el) return
          el.querySelector('.name').textContent = r.title || 'Página'
          el.querySelector('.meta').textContent = (r.mem ? (r.mem / 1048576).toFixed(0) + ' MB' : '') + (r.url ? ' · ' + r.url : '')
        })
        root.querySelectorAll('[data-kill]').forEach((b) => b.addEventListener('click', () => popupAPI.action(KEY, JSON.stringify({ t: 'kill', i: Number(b.dataset.kill) }))))
        const cl = root.querySelector('[data-close]')
        if (cl) cl.addEventListener('click', () => popupAPI.action(KEY, JSON.stringify({ t: 'close' })))
      }

      function renderAI(payload) {
        const thread = payload.thread || []
        const busy = !!payload.busy
        root.innerHTML =
          '<div class="ai-head"><span>Asistente IA</span><button class="icon-btn" data-close>' + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' + '</button></div>' +
          '<div class="ai-thread">' +
            (thread.length === 0 && !busy ? '<div class="ai-empty">Pregunta cualquier cosa.<br>Ej.: "Resume https://es.wikipedia.org/wiki/Chromium"</div>' : '') +
            thread.map((m, i) => '<div class="ai-msg ' + (m.role === 'user' ? 'user' : m.err ? 'err' : 'assistant') + '"></div>').join('') +
            (busy ? '<div class="ai-msg assistant thinking">Buscando y pensando…</div>' : '') +
          '</div>' +
          '<form class="ai-input"><input id="ai-in" placeholder="Escribe un mensaje…" spellcheck="false" /><button type="submit">Enviar</button></form>'
        thread.forEach((m, i) => {
          const el = root.querySelectorAll('.ai-thread .ai-msg')[i]
          if (el) el.textContent = m.content || ''
        })
        const inp = root.querySelector('#ai-in')
        if (inp) {
          inp.focus()
          inp.addEventListener('keydown', (e) => { if (e.key === 'Escape') popupAPI.action(KEY, JSON.stringify({ t: 'close' })) })
        }
        const form = root.querySelector('.ai-input')
        if (form) form.addEventListener('submit', (e) => {
          e.preventDefault()
          const v = (inp && inp.value || '').trim()
          if (!v || busy) return
          inp.value = ''
          popupAPI.action(KEY, JSON.stringify({ t: 'send', v }))
        })
        const cl = root.querySelector('[data-close]')
        if (cl) cl.addEventListener('click', () => popupAPI.action(KEY, JSON.stringify({ t: 'close' })))
      }

      popupAPI.onContent((d) => {
        KEY = d.key
        const p = d.payload || {}
        if (p.type === 'downloads') renderDownloads(p)
        else if (p.type === 'permission') renderPermission(p)
        else if (p.type === 'bookmark') renderBookmark(p)
        else if (p.type === 'toasts') renderToasts(p)
        else if (p.type === 'taskmanager') renderTaskManager(p)
        else if (p.type === 'ai') renderAI(p)
        else if (p.type === 'palette') renderList(p, (i) => popupAPI.action(KEY, JSON.stringify({ t: 'pick', i })), 'Escribe una acción o busca una pestaña…')
        else if (p.type === 'autocomplete') renderList(p, (i) => popupAPI.action(KEY, JSON.stringify({ t: 'pick', i })), 'Buscar…')
        else if (p.type === 'engine') renderList(p, (i) => popupAPI.action(KEY, JSON.stringify({ t: 'pick', i })), '')
        else if (p.type === 'tabsearch') renderList(p, (i) => popupAPI.action(KEY, JSON.stringify({ t: 'pick', i })), 'Buscar pestaña…')
        else if (p.type === 'dialog') renderDialog(p)
        else if (p.type === 'shields') renderShields(p)
        else if (p.type === 'siteinfo') renderSiteInfo(p)
        else if (p.type === 'profile') renderProfile(p)
        else renderMenu(p)
      })

      window.addEventListener('keydown', (e) => { if (e.key === 'Escape') popupAPI.close(KEY) })
    </script>
  </body>
</html>
