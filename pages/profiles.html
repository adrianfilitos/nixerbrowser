<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'" />
    <title>Perfiles</title>
    <style>
      :root { --bg:#151518; --bg2:#1c1c20; --bg3:#26262c; --border:#2e2e35; --text:#e9e9ee; --dim:#9c9ca6; --faint:#6c6c76; --accent:#6c7bff; --danger:#e05252; }
      :root.light { --bg:#f2f3f7; --bg2:#ffffff; --bg3:#ececf2; --border:#d9dae2; --text:#191a1f; --dim:#54555e; --faint:#7a7b85; --accent:#4a5ae0; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
      main { max-width:640px; margin:0 auto; padding:30px 24px; }
      h1 { font-size:22px; margin-bottom:18px; }
      .profile { display:flex; align-items:center; gap:14px; padding:14px 16px; border:1px solid var(--border); border-radius:14px; background:var(--bg2); margin-bottom:10px; }
      .profile .avatar { width:42px; height:42px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; flex-shrink:0; }
      .profile .info { flex:1; min-width:0; }
      .profile .info b { display:block; font-size:15px; }
      .profile .info span { color:var(--faint); font-size:12px; }
      .profile.current { border-color:var(--accent); box-shadow:0 0 0 2px rgba(108,123,255,.2); }
      button { padding:8px 14px; border-radius:9px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; font-size:13px; }
      button:hover { filter:brightness(1.12); }
      button.danger { color:var(--danger); }
      .new { display:flex; gap:8px; margin-top:16px; }
      .new input { flex:1; padding:10px 12px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; outline:none; }
      .new input:focus { border-color:var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Perfiles</h1>
      <div id="status" style="min-height:22px;font-size:12px;color:var(--accent);margin-bottom:6px"></div>
      <div id="list"></div>
      <div class="new">
        <input id="newName" placeholder="Nombre del nuevo perfil…" />
        <button id="create">Crear y cambiar</button>
      </div>
    </main>
    <script>
      var list = document.getElementById('list')
      var status = document.getElementById('status')

      function switchProfile(name) {
        if (document.querySelector('.profile.current')) {
          var cur = document.querySelector('.profile.current .info b').textContent
          if (name === 'default') name = cur === 'Perfil principal' ? 'default' : name
        }
        status.textContent = 'Cambiando al perfil "' + name + '"…'
        document.querySelectorAll('button').forEach(function (b) { b.disabled = true })
        browserAPI.profiles.switch(name)
      }

      function render() {
        browserAPI.profiles.list().then(function (d) {
          list.innerHTML = ''
          d.profiles.forEach(function (name) {
            var row = document.createElement('div')
            row.className = 'profile' + (name === d.current ? ' current' : '')
            row.innerHTML = '<span class="avatar"></span><div class="info"><b></b><span></span></div>' +
              (name !== d.current ? '<button class="use">Usar</button>' : '') +
              (name !== d.current && name !== 'default' ? '<button class="danger del">Borrar</button>' : '')
            row.querySelector('.avatar').textContent = name.charAt(0).toUpperCase()
            row.querySelector('.info b').textContent = name === 'default' ? 'Perfil principal' : name
            row.querySelector('.info span').textContent = name === d.current ? 'En uso' : (name === 'default' ? 'Perfil por defecto' : '')
            var use = row.querySelector('.use')
            if (use) use.onclick = function () { switchProfile(name) }
            var del = row.querySelector('.del')
            if (del) del.onclick = async function () {
              if (confirm('¿Borrar el perfil "' + name + '" y todos sus datos?')) {
                await browserAPI.profiles.remove(name)
                render()
              }
            }
            list.appendChild(row)
          })
        })
      }
      document.getElementById('create').onclick = function () {
        var name = document.getElementById('newName').value.trim()
        if (!name) return
        switchProfile(name)
      }
      render()
      browserAPI.settings.get().then(function (s) {
        var light = s.theme === 'light' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.toggle('light', light)
      })
    </script>
  </body>
</html>
