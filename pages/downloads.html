<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'" />
    <title>Descargas</title>
    <style>
      :root { --bg:#141414; --bg2:#1b1b1b; --bg3:#222; --border:#2c2c2c; --text:#e8e8e8; --dim:#9a9a9a; --faint:#6a6a6a; --accent:#4a6cf7; --danger:#e05252; }
      :root.light { --bg:#f4f4f4; --bg2:#ffffff; --bg3:#ececec; --border:#d6d6d6; --text:#1a1a1a; --dim:#555; --faint:#777; --danger:#d23b3b; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
      header { display:flex; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid var(--border); background:var(--bg2); }
      h1 { font-size:20px; font-weight:600; }
      button { padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; font-size:13px; }
      button:hover { filter:brightness(1.15); }
      button.danger { color:var(--danger); }
      main { max-width:860px; margin:0 auto; padding:16px 24px; }
      .row { display:flex; align-items:center; gap:14px; padding:12px; border-radius:10px; }
      .row:hover { background:var(--bg3); }
      .name { flex:1; min-width:0; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .state { flex-shrink:0; font-size:12px; }
      .state.in-progress { color:var(--accent); }
      .state.completed { color:#3da26e; }
      .state.cancelled { color:var(--danger); }
      .bar { height:4px; border-radius:2px; background:var(--border); overflow:hidden; width:120px; }
      .bar > div { height:100%; background:var(--accent); }
      .actions { flex-shrink:0; display:flex; gap:6px; }
      .link { background:transparent; border:none; color:var(--dim); }
      .link:hover { color:var(--text); }
      .empty { color:var(--faint); text-align:center; padding:60px 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>Descargas</h1>
      <button id="clear" class="danger">Limpiar completadas</button>
    </header>
    <main id="list"></main>
    <script>
      var list = document.getElementById('list')

      function fmtSize(n) {
        if (!n || n <= 0) return ''
        var units = ['B', 'KB', 'MB', 'GB']
        var i = 0
        while (n >= 1024 && i < units.length - 1) { n /= 1024; i++ }
        return n.toFixed(1) + ' ' + units[i]
      }

      function render() {
        browserAPI.downloads.list().then(function (items) {
          list.innerHTML = ''
          if (!items.length) {
            list.innerHTML = '<div class="empty">No hay descargas</div>'
            return
          }
          items.forEach(function (d) {
            var row = document.createElement('div')
            row.className = 'row'
            var pct = d.total > 0 ? Math.round((d.received / d.total) * 100) : 0
            row.innerHTML =
              '<span class="name"></span>' +
              '<span class="state ' + d.state + '"></span>' +
              '<div class="bar"><div style="width:' + (d.state === 'completed' ? 100 : pct) + '%"></div></div>' +
              '<span class="actions">' +
              (d.state === 'in-progress' ? '<button class="link cancel">Cancelar</button>' : '<button class="link open">Abrir</button><button class="link show">Mostrar</button><button class="link copy">Copiar</button>') +
              '</span>'
            row.querySelector('.name').textContent = d.name
            row.querySelector('.state').textContent =
              d.state === 'in-progress' ? pct + '%' : d.state === 'completed' ? 'Completado' : 'Cancelado'
            var cancel = row.querySelector('.cancel')
            if (cancel) cancel.onclick = async function () { await browserAPI.downloads.cancel(d.id); render() }
            var open = row.querySelector('.open')
            if (open) open.onclick = function () { if (d.path) browserAPI.downloads.open(d.path) }
            var show = row.querySelector('.show')
            if (show) show.onclick = function () { if (d.path) browserAPI.downloads.show(d.path) }
            var copy = row.querySelector('.copy')
            if (copy) copy.onclick = function () {
              var ta = document.createElement('textarea')
              ta.value = d.url
              document.body.appendChild(ta)
              ta.select()
              try { document.execCommand('copy') } catch {}
              document.body.removeChild(ta)
            }
            list.appendChild(row)
          })
        })
      }

      document.getElementById('clear').onclick = async function () {
        await browserAPI.downloads.clear()
        render()
      }
      browserAPI.onDownloads(render)
      render()

      browserAPI.settings.get().then(function (s) {
        if (s.theme === 'light' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light')
        }
      })
    </script>
  </body>
</html>
