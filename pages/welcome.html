<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Bienvenido a Nixer Browser</title>
    <style>
      :root { --bg:#101014; --card:#1a1a20; --border:#2a2a32; --text:#ececf2; --dim:#8a8a96; --accent:#6c7bff; }
      :root.light { --bg:#f4f5f9; --card:#ffffff; --border:#dcdde6; --text:#191a1f; --dim:#6a6b76; --accent:#4a5ae0; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
      .card { width:560px; max-width:92vw; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:40px 40px 32px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35); }
      .logo { width:64px; height:64px; margin:0 auto 18px; border-radius:18px; background:linear-gradient(135deg,#6c7bff,#4a5ae0); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:28px; color:#fff; }
      h1 { font-size:26px; margin-bottom:6px; }
      .sub { color:var(--dim); font-size:14px; margin-bottom:28px; line-height:1.5; }
      label { display:block; text-align:left; font-size:12px; color:var(--dim); margin-bottom:6px; }
      input[type="text"] { width:100%; height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; outline:none; margin-bottom:22px; }
      input[type="text"]:focus { border-color:var(--accent); }
      .colors { display:flex; justify-content:center; gap:12px; margin-bottom:28px; }
      .color { width:34px; height:34px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:transform .1s ease; }
      .color:hover { transform:scale(1.1); }
      .color.selected { border-color:var(--text); }
      button { width:100%; height:46px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
      button:hover { filter:brightness(1.1); }
      .note { margin-top:18px; color:var(--dim); font-size:12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">N</div>
      <h1>Bienvenido a Nixer Browser</h1>
      <p class="sub">Un navegador privado, rápido y con inteligencia integrada.<br/>Crea tu perfil para empezar.</p>
      <label for="name">Tu nombre</label>
      <input type="text" id="name" placeholder="Ej. Ana" maxlength="24" autofocus />
      <label>Color de perfil</label>
      <div class="colors" id="colors"></div>
      <button id="create">Crear perfil y empezar</button>
      <div class="note">Tu historial, marcadores y ajustes se guardan solo en este equipo.</div>
    </div>
    <script>
      var COLORS = ['#6c7bff', '#3da26e', '#d99a2b', '#e05252', '#b44ae0', '#1fb6c9', '#f07a5a', '#8a9b6e']
      var selected = COLORS[0]
      var box = document.getElementById('colors')
      COLORS.forEach(function (c) {
        var el = document.createElement('div')
        el.className = 'color' + (c === selected ? ' selected' : '')
        el.style.background = c
        el.onclick = function () {
          box.querySelectorAll('.color').forEach(function (x) { x.classList.remove('selected') })
          el.classList.add('selected')
          selected = c
        }
        box.appendChild(el)
      })

      document.getElementById('create').onclick = async function () {
        var name = document.getElementById('name').value.trim()
        if (!name) { document.getElementById('name').focus(); return }
        await browserAPI.settings.set({ profileCreated: true, profileName: name, profileColor: selected })
        location.href = 'nixer://newtab'
      }
      document.getElementById('name').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('create').click() })

      browserAPI.settings.get().then(function (s) {
        var light = s.theme === 'light' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.toggle('light', light)
        if (s.profileName) document.getElementById('name').value = s.profileName
      })
    </script>
  </body>
</html>
