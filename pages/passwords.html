<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'" />
    <title>Contraseñas</title>
    <style>
      :root { --bg:#151518; --bg2:#1c1c20; --bg3:#26262c; --border:#2e2e35; --text:#e9e9ee; --dim:#9c9ca6; --faint:#6c6c76; --accent:#6c7bff; --danger:#e05252; }
      :root.light { --bg:#f2f3f7; --bg2:#ffffff; --bg3:#ececf2; --border:#d9dae2; --text:#191a1f; --dim:#54555e; --faint:#7a7b85; --accent:#4a5ae0; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
      header { display:flex; align-items:center; gap:14px; padding:16px 24px; border-bottom:1px solid var(--border); background:var(--bg2); }
      h1 { font-size:20px; font-weight:600; }
      button { padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; font-size:13px; }
      button:hover { filter:brightness(1.12); }
      main { max-width:760px; margin:0 auto; padding:16px 24px; }
      .row { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; }
      .row:hover { background:var(--bg3); }
      .origin { font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .user { color:var(--dim); font-size:12px; width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .pass { color:var(--faint); font-size:12px; width:120px; }
      .del { background:transparent; border:none; color:var(--dim); }
      .del:hover { color:var(--danger); }
      .empty { color:var(--faint); text-align:center; padding:60px 0; }
      .add { margin-top:18px; padding:14px; border:1px solid var(--border); border-radius:12px; background:var(--bg2); }
      .add h2 { font-size:14px; margin-bottom:10px; color:var(--dim); }
      .add .fields { display:flex; gap:8px; flex-wrap:wrap; }
      .add input { flex:1; min-width:150px; padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; outline:none; }
      .add input:focus { border-color:var(--accent); }
    </style>
  </head>
  <body>
    <header><h1>Contraseñas</h1></header>
    <main>
      <div id="list"></div>
      <div class="add">
        <h2>Añadir contraseña</h2>
        <div class="fields">
          <input id="origin" placeholder="Sitio (ej. https://example.com)" />
          <input id="user" placeholder="Usuario" />
          <input id="pass" type="text" placeholder="Contraseña" />
          <button id="add">Guardar</button>
        </div>
      </div>
    </main>
    <script>
      var list = document.getElementById('list')

      function render() {
        browserAPI.passwords.list().then(function (items) {
          list.innerHTML = ''
          if (!items.length) { list.innerHTML = '<div class="empty">No hay contraseñas guardadas</div>'; return }
          items.forEach(function (p) {
            var row = document.createElement('div')
            row.className = 'row'
            row.innerHTML = '<span class="origin"></span><span class="user"></span><span class="pass">••••••••</span><button class="del">Quitar</button>'
            row.querySelector('.origin').textContent = p.origin
            row.querySelector('.user').textContent = p.username
            row.querySelector('.pass').title = p.password
            row.querySelector('.del').onclick = async function () {
              await browserAPI.passwords.remove(p.id)
              render()
            }
            list.appendChild(row)
          })
        })
      }

      document.getElementById('add').onclick = async function () {
        var origin = document.getElementById('origin').value.trim()
        var username = document.getElementById('user').value.trim()
        var password = document.getElementById('pass').value
        if (!origin || !password) return
        await browserAPI.passwords.add({ origin: origin.replace(/\/+$/, ''), username: username, password: password })
        document.getElementById('origin').value = ''
        document.getElementById('user').value = ''
        document.getElementById('pass').value = ''
        render()
      }
      render()

      browserAPI.settings.get().then(function (s) {
        var light = s.theme === 'light' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.toggle('light', light)
      })
    </script>
  </body>
</html>
