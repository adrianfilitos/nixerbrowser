<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'" />
    <title>No se puede acceder a este sitio</title>
    <style>
      :root { --bg:#151518; --bg2:#1c1c20; --bg3:#26262c; --border:#2e2e35; --text:#e9e9ee; --dim:#9c9ca6; --faint:#6c6c76; --accent:#7aa2f7; --danger:#e05252; }
      :root.light { --bg:#f2f3f7; --bg2:#ffffff; --bg3:#ececf2; --border:#d9dae2; --text:#191a1f; --dim:#54555e; --faint:#7a7b85; --accent:#2f6bd8; --danger:#c23a3a; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
      .card { width:560px; max-width:92vw; background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:28px; text-align:center; }
      .ico { width:64px; height:64px; border-radius:50%; background:rgba(224,82,82,.15); color:var(--danger); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
      h1 { font-size:20px; margin-bottom:10px; }
      .desc { color:var(--dim); font-size:13px; line-height:1.6; margin-bottom:16px; }
      .url { color:var(--dim); font-size:13px; word-break:break-all; background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin:0 0 18px; }
      .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
      .btn { padding:10px 18px; border-radius:10px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; font-size:13px; font-family:inherit; }
      .btn:hover { filter:brightness(1.12); }
      .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
      .meta { margin-top:18px; color:var(--faint); font-size:11px; word-break:break-all; }
      .meta b { color:var(--dim); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="ico">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="M2 12h20" />
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
          <path d="M12 8v4M12 15.5h.01" />
        </svg>
      </div>
      <h1 id="title">No se puede acceder a este sitio</h1>
      <p class="desc" id="desc"></p>
      <div class="url" id="url"></div>
      <div class="actions">
        <button class="btn" id="back">Volver</button>
        <button class="btn primary" id="reload">Recargar</button>
      </div>
      <div class="meta" id="meta"></div>
    </div>
    <script>
      var ERRORS = {
        '-6':   ['Archivo no encontrado', 'No se pudo encontrar el archivo o la carpeta solicitada.'],
        '-21':  ['Tiempo de espera agotado', 'La conexión se canceló porque tardó demasiado.'],
        '-102': ['El sitio rechazó la conexión', 'El servidor está activo, pero rechazó la conexión. Puede que esté bloqueando tu acceso o que el puerto esté cerrado.'],
        '-105': ['El sitio no se pudo encontrar', 'No se pudo resolver la dirección del sitio. Comprueba que la URL esté bien escrita o busca el sitio en Internet.'],
        '-106': ['Sin conexión a Internet', 'No hay conexión a Internet. Comprueba tu red y vuelve a intentarlo.'],
        '-109': ['La dirección es inaccesible', 'No se pudo llegar al servidor. Puede que la red o el sitio estén caídos.'],
        '-111': ['Conexión restablecida', 'El servidor cerró la conexión de forma inesperada.'],
        '-112': ['No se pudo conectar', 'No se pudo establecer la conexión con el servidor.'],
        '-118': ['Tiempo de espera agotado', 'El sitio tardó demasiado en responder. Puede que esté saturado o que tu conexión sea lenta.'],
        '-130': ['Demasiadas redirecciones', 'El sitio redirige demasiadas veces. Puede que haya un bucle de redirección.'],
        '-137': ['No se pudo resolver el nombre', 'No se pudo resolver el nombre de dominio del sitio.'],
        '-200': ['Certificado de seguridad no válido', 'El certificado de seguridad no corresponde al sitio (error de nombre).'],
        '-201': ['Certificado caducado', 'El certificado de seguridad del sitio ha caducado.'],
        '-202': ['Certificado no fiable', 'El certificado de seguridad no fue emitido por una autoridad de confianza.'],
        '-203': ['Certificado con errores', 'El certificado de seguridad del sitio contiene errores.'],
        '-206': ['Certificado revocado', 'El certificado de seguridad del sitio fue revocado.'],
        '-207': ['Certificado inválido', 'El certificado de seguridad del sitio es inválido.'],
        '-324': ['El sitio no respondió', 'El servidor respondió de forma vacía o inesperada.'],
        '-501': ['Conexión cifrada no válida', 'No se pudo establecer una conexión cifrada segura con el sitio.'],
        '-502': ['Error de autenticación', 'El servidor rechazó el certificado de autenticación del cliente.'],
      }
      var p = new URLSearchParams(location.search)
      var target = p.get('url') || ''
      var code = parseInt(p.get('code'), 10) || 0
      var raw = p.get('desc') || ''
      var entry = ERRORS[String(code)] || null
      var cert = code <= -200 && code >= -210
      var title = document.getElementById('title')
      var desc = document.getElementById('desc')
      if (!entry) {
        if (cert) entry = ['Certificado de seguridad no válido', 'El certificado de seguridad del sitio no es válido. No se pudo comprobar la identidad del servidor.']
        else entry = ['No se puede acceder a este sitio', 'Algo salió mal al cargar esta página. Comprueba tu conexión a Internet y vuelve a intentarlo.']
      }
      title.textContent = entry[0]
      desc.textContent = entry[1]
      try { document.getElementById('url').textContent = target } catch {}
      var meta = document.getElementById('meta')
      if (code || raw) {
        var m = 'Código de error: ' + (code ? '<b>' + code + '</b>' : '—')
        if (raw) m += ' · ' + raw
        meta.innerHTML = m
      }
      document.getElementById('back').onclick = function () { history.length > 1 ? history.back() : (location.href = 'nixer://newtab') }
      document.getElementById('reload').onclick = function () { if (target) location.href = target }
      browserAPI.settings.get().then(function (s) {
        var light = s.theme === 'light' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.toggle('light', light)
      })
    </script>
  </body>
</html>
