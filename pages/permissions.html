<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'" />
    <title>Permisos de sitios</title>
    <style>
      :root { --bg:#141414; --bg2:#1b1b1b; --bg3:#222; --border:#2c2c2c; --text:#e8e8e8; --dim:#9a9a9a; --faint:#6a6a6a; --accent:#4a6cf7; --danger:#e05252; --ok:#3da26e; }
      :root.light { --bg:#f4f4f4; --bg2:#ffffff; --bg3:#ececec; --border:#d6d6d6; --text:#1a1a1a; --dim:#555; --faint:#777; --danger:#d23b3b; --ok:#2f7d4f; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
      header { display:flex; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid var(--border); background:var(--bg2); }
      h1 { font-size:20px; font-weight:600; flex:1; }
      button { padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; font-size:13px; }
      button:hover { filter:brightness(1.15); }
      button.danger { color:var(--danger); }
      main { max-width:860px; margin:0 auto; padding:16px 24px; }
      .empty { color:var(--faint); text-align:center; padding:60px 0; line-height:1.7; }
      .site { border:1px solid var(--border); border-radius:12px; background:var(--bg2); margin-bottom:12px; overflow:hidden; }
      .site-head { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); }
      .site-origin { flex:1; font-weight:600; word-break:break-all; }
      .site-host { color:var(--dim); font-size:12px; }
      .perm-row { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--border); }
      .perm-row:last-child { border-bottom:none; }
      .perm-name { flex:1; font-size:14px; }
      .seg { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
      .seg button { border:none; border-radius:0; background:transparent; color:var(--dim); padding:6px 12px; font-size:12px; }
      .seg button.on-allow { background:rgba(61,162,110,.18); color:var(--ok); font-weight:600; }
      .seg button.on-deny { background:rgba(224,82,82,.16); color:var(--danger); font-weight:600; }
      .seg button.on-ask { background:var(--bg3); color:var(--text); font-weight:600; }
      .note { color:var(--faint); font-size:12px; padding:12px 16px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Permisos de sitios</h1>
      <button id="clearAll" class="danger">Borrar todo</button>
    </header>
    <main id="list"></main>
    <script>
      var list = document.getElementById('list')

      var LABELS = {
        media: 'Cámara y micrófono', camera: 'Cámara', microphone: 'Micrófono',
        geolocation: 'Ubicación', notifications: 'Notificaciones',
        'clipboard-read': 'Leer portapapeles', 'clipboard-sanitized-write': 'Escribir portapapeles',
        'display-capture': 'Captura de pantalla', keyboardLock: 'Bloqueo de teclado',
        'window-management': 'Ventanas', fileSystem: 'Archivos', fullscreen: 'Pantalla completa',
        pointerLock: 'Bloqueo del puntero', openExternal: 'Abrir enlaces externos',
        midi: 'MIDI', midiSysex: 'MIDI (sistema)', serial: 'Puertos serie', hid: 'Dispositivos HID',
        usb: 'Dispositivos USB', 'storage-access': 'Almacenamiento', 'local-fonts': 'Fuentes locales',
        unknown: 'Permiso',
      }
      var STATE_LABEL = { allow: 'Permitir', deny: 'Bloquear', ask: 'Preguntar' }

      function hostOf(origin) {
        try { return new URL(origin).hostname } catch { return origin }
      }

      function render() {
        browserAPI.permissions.list().then(function (sites) {
          list.innerHTML = ''
          if (!sites.length) {
            list.innerHTML = '<div class="empty">Ningún sitio tiene permisos guardados.<br/>Los permisos se guardan aquí cuando permites o bloqueas un permiso de un sitio.</div>'
            return
          }
          sites.forEach(function (site) {
            var card = document.createElement('div')
            card.className = 'site'
            var head = document.createElement('div')
            head.className = 'site-head'
            var origin = document.createElement('span')
            origin.className = 'site-origin'
            origin.textContent = site.origin
            var host = document.createElement('span')
            host.className = 'site-host'
            host.textContent = hostOf(site.origin)
            var del = document.createElement('button')
            del.className = 'danger'
            del.textContent = 'Borrar'
            del.onclick = async function () { await browserAPI.permissions.clear(site.origin); render() }
            head.appendChild(origin)
            head.appendChild(host)
            head.appendChild(del)
            card.appendChild(head)
            if (!site.perms || !site.perms.length) {
              var n = document.createElement('div')
              n.className = 'note'
              n.textContent = 'Sin permisos guardados'
              card.appendChild(n)
            } else {
              site.perms.forEach(function (p) {
                var row = document.createElement('div')
                row.className = 'perm-row'
                var name = document.createElement('div')
                name.className = 'perm-name'
                name.textContent = LABELS[p.permission] || p.permission
                var seg = document.createElement('div')
                seg.className = 'seg'
                ;['allow', 'deny', 'ask'].forEach(function (st) {
                  var b = document.createElement('button')
                  b.textContent = STATE_LABEL[st]
                  if (p.state === st) b.className = 'on-' + st
                  b.onclick = async function () { await browserAPI.permissions.set(site.origin, p.permission, st); render() }
                  seg.appendChild(b)
                })
                row.appendChild(name)
                row.appendChild(seg)
                card.appendChild(row)
              })
            }
            list.appendChild(card)
          })
        })
      }

      document.getElementById('clearAll').onclick = async function () {
        await browserAPI.permissions.clearAll()
        render()
      }
      browserAPI.onSettings(function () { render() })
      render()

      browserAPI.settings.get().then(function (s) {
        if (s.theme === 'light' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light')
        }
      })
    </script>
  </body>
</html>
