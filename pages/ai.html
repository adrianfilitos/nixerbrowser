<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'" />
    <title>Asistente IA</title>
    <style>
      :root { --bg:#151518; --bg2:#1c1c20; --bg3:#26262c; --border:#2e2e35; --text:#e9e9ee; --dim:#9c9ca6; --faint:#6c6c76; --accent:#6c7bff; }
      :root.light { --bg:#f2f3f7; --bg2:#ffffff; --bg3:#ececf2; --border:#d9dae2; --text:#191a1f; --dim:#54555e; --faint:#7a7b85; --accent:#4a5ae0; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
      header { display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--border); background:var(--bg2); }
      h1 { font-size:18px; font-weight:600; }
      .tag { font-size:12px; color:var(--accent); background:rgba(108,123,255,.15); padding:3px 10px; border-radius:20px; }
      .tag.warn { color:var(--faint); background:var(--bg3); }
      main { flex:1; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:12px; max-width:820px; margin:0 auto; width:100%; }
      .msg { max-width:85%; padding:11px 15px; border-radius:14px; font-size:14px; line-height:1.55; white-space:pre-wrap; word-break:break-word; user-select:text; }
      .msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
      .msg.assistant { align-self:flex-start; background:var(--bg3); border-bottom-left-radius:4px; }
      .msg.thinking { color:var(--faint); font-style:italic; }
      .empty { align-self:center; color:var(--faint); text-align:center; padding:60px 0; line-height:1.7; }
      footer { display:flex; gap:10px; padding:14px 22px; border-top:1px solid var(--border); background:var(--bg2); max-width:820px; margin:0 auto; width:100%; }
      input { flex:1; padding:13px 18px; border-radius:22px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; outline:none; }
      input:focus { border-color:var(--accent); }
      button { padding:12px 20px; border-radius:22px; border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
      button:hover { filter:brightness(1.1); }
      button:disabled { opacity:.5; cursor:default; }
      a { color:var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <h1>Asistente IA</h1>
      <span id="status" class="tag">�?�</span>
    </header>
    <main id="chat"></main>
    <footer>
      <input id="q" placeholder="Haz una pregunta, pide un resumen o que te explique algo�?�" />
      <button id="send">Enviar</button>
    </footer>
    <script>
      var chat = document.getElementById('chat')
      var q = document.getElementById('q')
      var send = document.getElementById('send')
      var status = document.getElementById('status')
      var thread = []

      function render() {
        chat.innerHTML = ''
        if (!thread.length) {
          var d = document.createElement('div')
          d.className = 'empty'
          d.innerHTML = 'Pregunta cualquier cosa.<br/>Ejemplos:<br/>"Explica qué es el DOM en 3 frases"<br/>"Resume esta página: https://es.wikipedia.org/wiki/Chromium"<br/>"Escribe un texto breve sobre Linux para un blog"'
          chat.appendChild(d)
          return
        }
        thread.forEach(function (m) {
          var el = document.createElement('div')
          el.className = 'msg ' + m.role
          el.textContent = m.content
          chat.appendChild(el)
        })
        chat.scrollTop = chat.scrollHeight
      }

      async function ask(text) {
        var userMsg = { role: 'user', content: text }
        thread.push(userMsg)
        render()
        send.disabled = true
        var thinking = document.createElement('div')
        thinking.className = 'msg assistant thinking'
        thinking.textContent = 'Pensando�?�'
        chat.appendChild(thinking)
        chat.scrollTop = chat.scrollHeight
        var res = await browserAPI.ai.chat(thread)
        if (thinking.parentNode) thinking.parentNode.removeChild(thinking)
        thread.push({ role: 'assistant', content: res && res.text ? res.text : 'Error: ' + ((res && res.error) || 'sin respuesta') })
        send.disabled = false
        render()
        q.focus()
      }

      function go() {
        var v = q.value.trim()
        if (!v) return
        q.value = ''
        ask(v)
      }

      send.onclick = go
      q.addEventListener('keydown', function (e) { if (e.key === 'Enter') go() })

      browserAPI.settings.get().then(function (s) {
        if (s.aiBaseUrl && s.aiApiKey) {
          status.textContent = 'Conectado · ' + (s.aiModel || 'gpt-4o-mini')
          status.className = 'tag'
        } else {
          status.textContent = 'Sin configurar �?" ve a Ajustes'
          status.className = 'tag warn'
        }
      })

      browserAPI.settings.get().then(function (s) {
        var light = s.theme === 'light' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.toggle('light', light)
      })
    </script>
  </body>
</html>
