<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'" />
    <title>Acerca de Nixer Browser</title>
    <style>
      :root { --bg:#151518; --bg2:#1c1c20; --bg3:#26262c; --border:#2e2e35; --text:#e9e9ee; --dim:#9c9ca6; --faint:#6c6c76; --accent:#6c7bff; }
      :root.light { --bg:#f2f3f7; --bg2:#ffffff; --bg3:#ececf2; --border:#d9dae2; --text:#191a1f; --dim:#54555e; --faint:#7a7b85; --accent:#4a5ae0; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
      main { max-width:640px; margin:0 auto; padding:40px 24px; }
      .logo { width:72px; height:72px; border-radius:18px; background:linear-gradient(135deg,var(--accent),var(--accent)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:34px; font-weight:800; margin-bottom:18px; }
      h1 { font-size:24px; margin-bottom:4px; }
      .ver { color:var(--dim); margin-bottom:26px; }
      .row { display:flex; justify-content:space-between; gap:12px; padding:11px 14px; border-bottom:1px solid var(--border); font-size:13px; }
      .row b { color:var(--dim); font-weight:500; }
      .row span { word-break:break-all; text-align:right; }
      .card { background:var(--bg2); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:22px; }
      h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--faint); margin:0 0 10px; }
      .credits { color:var(--dim); font-size:13px; line-height:1.7; }
      .credits a { color:var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">N</div>
      <h1>Nixer Browser</h1>
      <div class="ver" id="ver">…</div>

      <h2>Información</h2>
      <div class="card" id="info"></div>

      <h2>Créditos</h2>
      <div class="credits">
        Nixer Browser está construido sobre <a href="https://www.electronjs.org/">Electron</a> y <a href="https://www.chromium.org/">Chromium</a>,
        con interfaz en <a href="https://react.dev/">React</a>. El soporte de extensiones usa
        <a href="https://github.com/samuelmaddock/electron-chrome-extensions">electron-chrome-extensions</a>.
        Protección con listas de <a href="https://urlhaus.abuse.ch/">URLhaus</a> y bloqueo de anuncios con listas propias.
      </div>
    </main>
    <script>
      browserAPI.app.info().then(function (i) {
        if (!i) return
        document.getElementById('ver').textContent = 'Versión ' + i.version
        var rows = [
          ['Versión de la app', i.version],
          ['Build (commit)', i.build || '—'],
          ['Electron', i.electron],
          ['Chromium', i.chrome],
          ['Node.js', i.node],
          ['Plataforma', i.platform + ' ' + i.arch],
          ['Motor de búsqueda', i.defaultEngine],
          ['Extensiones instaladas', String(i.extensions)],
          ['Dominios en la lista de bloqueo', String(i.adblockDomains)],
          ['Perfil', i.userData],
        ]
        var card = document.getElementById('info')
        rows.forEach(function (r) {
          var row = document.createElement('div')
          row.className = 'row'
          var b = document.createElement('b')
          b.textContent = r[0]
          var span = document.createElement('span')
          span.textContent = r[1]
          row.appendChild(b)
          row.appendChild(span)
          card.appendChild(row)
        })
      })
      browserAPI.settings.get().then(function (s) {
        var light = s.theme === 'light' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.toggle('light', light)
      })
    </script>
  </body>
</html>
