<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'" />
    <title>Sitio potencialmente peligroso</title>
    <style>
      :root { --bg:#151518; --bg2:#1c1c20; --bg3:#26262c; --border:#2e2e35; --text:#e9e9ee; --dim:#9c9ca6; --faint:#6c6c76; --danger:#e05252; --warn:#d99a2b; }
      :root.light { --bg:#f2f3f7; --bg2:#ffffff; --bg3:#ececf2; --border:#d9dae2; --text:#191a1f; --dim:#54555e; --faint:#7a7b85; }
      * { box-sizing:border-box; margin:0; padding:0; }
      body { font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
      .card { width:560px; max-width:92vw; background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:28px; text-align:center; }
      .ico { width:64px; height:64px; border-radius:50%; background:rgba(224,82,82,.15); color:var(--danger); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
      h1 { font-size:20px; margin-bottom:10px; }
      .url { color:var(--dim); font-size:13px; word-break:break-all; background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin:14px 0; }
      p { color:var(--dim); font-size:13px; line-height:1.6; margin-bottom:18px; }
      .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
      .btn { padding:10px 18px; border-radius:10px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; font-size:13px; }
      .btn:hover { filter:brightness(1.12); }
      .btn.danger { color:var(--danger); }
      .btn.primary { background:var(--danger); border-color:var(--danger); color:#fff; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="ico">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z" />
          <path d="M12 8v5M12 16h.01" />
        </svg>
      </div>
      <h1>Sitio potencialmente peligroso</h1>
      <p>Este sitio figura en listas de malware o phishing (URLhaus). Abrirlo puede poner en riesgo tu seguridad y tus datos.</p>
      <div class="url" id="url"></div>
      <div class="actions">
        <button class="btn" id="back">Volver</button>
        <button class="btn primary" id="continue">Continuar de todos modos</button>
      </div>
    </div>
    <script>
      var target = new URLSearchParams(location.search).get('url') || ''
      try { document.getElementById('url').textContent = decodeURIComponent(target) } catch {}
      var host = ''
      try { host = new URL(target).hostname } catch {}
      document.getElementById('back').onclick = function () { history.length > 1 ? history.back() : (location.href = 'nixer://newtab') }
      document.getElementById('continue').onclick = function () {
        browserAPI.safe.allow(host).then(function () { location.href = target })
      }
      browserAPI.settings.get().then(function (s) {
        var light = s.theme === 'light' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.toggle('light', light)
      })
    </script>
  </body>
</html>
